# VirtualHost del interfono, para el VPS donde Apache ya sirve otras webs en
# produccion.
#
# POR QUE APACHE Y NO CADDY. El diseno original levantaba Caddy en el 80 y el 443.
# En el VPS real esos puertos los tiene Apache con varios sitios en produccion, asi
# que disputarselos era tumbar el servicio. Aqui Apache hace de puerta -sirve la
# SPA y traduce el WebSocket- y Mosquitto escucha SOLO en 127.0.0.1.
#
# Consecuencia de seguridad, y es buena: el broker no esta expuesto a internet.
# Desde fuera solo existe atravesando Apache por TLS.
#
# REGLA AL TOCAR ESTO: fichero propio, nunca editar los vhosts existentes. Si algo
# falla se desactiva con `a2dissite interfono.kordino.com` y no queda rastro.
# Siempre `apache2ctl configtest` antes de recargar, y `reload`, nunca `restart`.

# OJO: los dos VirtualHost tienen DocumentRoot DISTINTO, y es a proposito.
#
#   :80  -> /var/www/app_interfono          (raiz del repo)
#   :443 -> /var/www/app_interfono/apps/web/dist  (solo lo compilado)
#
# El del 80 existe unicamente para que Let's Encrypt deje su fichero de
# validacion: es el `-w` con el que se emitio el certificado y el que quedo
# grabado en /etc/letsencrypt/renewal/. Cambiarlo rompe la RENOVACION, que fallara
# sola dentro de 60 dias y de madrugada.
#
# No sirve nada mas porque el RewriteRule de abajo redirige todo lo que no sea
# /.well-known/acme-challenge/. Si alguien quita esa redireccion, el repositorio
# entero -incluido infra/mosquitto/passwd y .git/- queda navegable por HTTP.
<VirtualHost *:80>
    ServerName interfono.kordino.com
    DocumentRoot /var/www/app_interfono

    # Se deja el 80 vivo por dos motivos: la renovacion de Let's Encrypt valida
    # por aqui, y un kiosco mal configurado con http:// acaba en https en vez de
    # en una pagina en blanco.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://interfono.kordino.com/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/interfono-error.log
    CustomLog ${APACHE_LOG_DIR}/interfono-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName interfono.kordino.com
    # SOLO lo compilado. Apuntarlo a la raiz del repo publicaria por HTTP
    # infra/mosquitto/passwd y .git/ enteros: Apache sirve los ficheros que
    # existen, y FallbackResource solo actua sobre las rutas que NO existen.
    DocumentRoot /var/www/app_interfono/apps/web/dist

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/interfono.kordino.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/interfono.kordino.com/privkey.pem

    # El WebSocket de MQTT. Va ANTES que nada: ProxyPass se evalua antes que el
    # sistema de ficheros, asi que /mqtt nunca cae en el DocumentRoot.
    #
    # No hace falta subir ProxyTimeout: el cliente usa keepalive de 20 s (ver
    # KEEPALIVE_SEGUNDOS en cliente-mqtt.ts), asi que la conexion nunca queda
    # ociosa lo suficiente para que Apache la corte.
    ProxyPreserveHost On
    ProxyPass        /mqtt  ws://127.0.0.1:9001/
    ProxyPassReverse /mqtt  ws://127.0.0.1:9001/

    <Directory /var/www/app_interfono/apps/web/dist>
        Require all granted
        Options -Indexes
        # La SPA es una sola pagina; cualquier ruta desconocida cae en ella.
        FallbackResource /index.html
    </Directory>

    # Pero NO para los ficheros estaticos. Con el fallback puesto en todo, un
    # asset que falta se sirve como `index.html` con un 200: el navegador carga
    # HTML creyendo que es JavaScript y el fallo aparece mucho despues y en otro
    # sitio. Paso de verdad -faltaba vendor/external_api.js- y el sintoma era que
    # las llamadas se cortaban al aceptar, sin nada que apuntara al fichero.
    # Desactivandolo aqui, un asset que falta da 404 y se ve al instante.
    <Directory /var/www/app_interfono/apps/web/dist/assets>
        FallbackResource disabled
        # Nombres con hash: si el contenido cambia, cambia el nombre. Cachear un
        # año es seguro y ahorra el bundle entero en cada recarga preventiva.
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>
    <Directory /var/www/app_interfono/apps/web/dist/vendor>
        FallbackResource disabled
    </Directory>
    <Directory /var/www/app_interfono/apps/web/dist/marca>
        FallbackResource disabled
        # Los logotipos NO llevan hash: /marca/sedes/lorca.svg se llama igual antes
        # y despues de cambiarlo. Sin un tope corto, sustituir un logotipo no se
        # veria en los totems hasta que al navegador le diera la gana.
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=300"
        </IfModule>
    </Directory>

    # El index.html NUNCA se cachea, y esto es lo importante de todo el bloque.
    # Cada compilacion genera nombres de assets nuevos y borra los viejos. Un
    # index.html cacheado apuntaria a ficheros que ya no existen, y el totem se
    # quedaria en blanco tras la recarga preventiva de las 6 h: de madrugada, sin
    # nadie delante y sin forma de saber por que.
    <IfModule mod_headers.c>
        <Files "index.html">
            Header set Cache-Control "no-cache, must-revalidate"
        </Files>
    </IfModule>

    # El bundle son 383 KB que bajan a 112 comprimidos. En el arranque de un
    # kiosco, y otra vez en cada recarga preventiva de 6 h, se nota.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/interfono-error.log
    CustomLog ${APACHE_LOG_DIR}/interfono-access.log combined
</VirtualHost>
</IfModule>
